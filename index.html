<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أكاديمية الأبطال لكرة القدم</title>
  <!-- Tailwind CSS للواجهات الجذابة -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome للأيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
    .fifa-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #eab308;
    }
  </style>
</head>
<body class="pb-20">

  <!-- الهيدر العلوي -->
  <header class="bg-emerald-600 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
    <div class="flex items-center space-x-2 space-x-reverse">
      <i class="fa-solid fa-futbol text-2xl text-yellow-300"></i>
      <h1 class="font-bold text-lg">أكاديمية الأبطال</h1>
    </div>
    <!-- وضع الدخول -->
    <button id="roleToggleBtn" onclick="toggleRole()" class="bg-emerald-800 hover:bg-emerald-900 text-xs text-yellow-300 px-3 py-1.5 rounded-full border border-yellow-400 font-semibold transition">
      <i class="fa-solid fa-user-shield ml-1"></i> وضع المشاهد
    </button>
  </header>

  <!-- محتوى الصفحة الرئيسية -->
  <main class="p-4 max-w-md mx-auto">

    <!-- شريط التنبيهات -->
    <div class="bg-emerald-100 border-r-4 border-emerald-500 text-emerald-800 p-3 rounded shadow-sm text-sm mb-4 flex items-center justify-between">
      <span>⚽ التمرين القادم: <strong>الغد - الساعة 4:00 مساءً</strong></span>
    </div>

    <!-- ترويسة القسم -->
    <div class="flex justify-between items-center mb-3">
      <h2 class="font-bold text-gray-800 text-base" id="sectionTitle">قائمة نجوم الأكاديمية</h2>
      <button id="addPlayerBtn" onclick="openModal()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg shadow font-semibold">
        <i class="fa-solid fa-plus ml-1"></i> إضافة لاعب
      </button>
    </div>

    <!-- شبكة عرض بطاقات اللاعبين -->
    <div id="playersGrid" class="grid grid-cols-1 gap-4">
      <!-- يتم توليد البطاقات ديناميكياً بواسطة JavaScript -->
    </div>

  </main>

  <!-- نافذة إضافة/تعديل لاعب (الأدمن فقط) -->
  <div id="playerModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-md p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-gray-800">إضافة لاعب جديد</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="playerForm" onsubmit="savePlayer(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">اسم اللاعب</label>
          <input type="text" id="pName" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">تاريخ الميلاد</label>
            <input type="date" id="pDob" required onchange="calculateAge()" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">العمر</label>
            <input type="number" id="pAge" readonly class="w-full bg-gray-100 border rounded-lg p-2 text-sm text-gray-600 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">المركز المفضل</label>
          <select id="pPosition" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="مهاجم">مهاجم (FW)</option>
            <option value="خط وسط">خط وسط (MF)</option>
            <option value="مدافع">مدافع (DF)</option>
            <option value="حارس مرمى">حارس مرمى (GK)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">رابط صورة اللاعب (اختياري)</label>
          <input type="url" id="pPhoto" placeholder="https://..." class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-lg hover:bg-emerald-700 transition">حفظ البيانات</button>
      </form>
    </div>
  </div>

  <!-- شريط التنقل السفلي -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 max-w-md mx-auto z-40">
    <button class="flex flex-col items-center text-emerald-600 font-semibold text-xs">
      <i class="fa-solid fa-users text-lg"></i>
      <span>اللاعبون</span>
    </button>
    <button class="flex flex-col items-center text-gray-400 font-semibold text-xs hover:text-emerald-600">
      <i class="fa-solid fa-calendar-days text-lg"></i>
      <span>التمارين</span>
    </button>
    <button class="flex flex-col items-center text-gray-400 font-semibold text-xs hover:text-emerald-600">
      <i class="fa-solid fa-trophy text-lg"></i>
      <span>النجوم</span>
    </button>
  </nav>

  <!-- الكود البرمجي التفاعلي -->
  <script>
    let isAdmin = false;
    let players = [
      { id: 1, name: "أحمد محمد", dob: "2014-05-12", age: 12, position: "مهاجم", photo: "https://images.unsplash.com/photo-1543351611-c82394862a50?w=150&auto=format&fit=crop" },
      { id: 2, name: "عمر خالد", dob: "2015-08-20", age: 11, position: "خط وسط", photo: "https://images.unsplash.com/photo-1508215141170-ee24490333d4?w=150&auto=format&fit=crop" }
    ];

    function renderPlayers() {
      const container = document.getElementById('playersGrid');
      container.innerHTML = '';

      players.forEach(p => {
        const card = document.createElement('div');
        card.className = "fifa-card text-white p-4 rounded-2xl shadow-lg relative flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center space-x-3 space-x-reverse">
            <img src="${p.photo}" class="w-16 h-16 rounded-full border-2 border-yellow-400 object-cover shadow">
            <div>
              <h3 class="font-bold text-lg text-yellow-400">${p.name}</h3>
              <p class="text-xs text-gray-300"><i class="fa-solid fa-shirt text-emerald-400 ml-1"></i>${p.position}</p>
              <p class="text-xs text-gray-400 mt-1"><i class="fa-solid fa-cake-candles ml-1"></i>${p.age} سنة (${p.dob})</p>
            </div>
          </div>
          ${isAdmin ? `
            <button onclick="deletePlayer(${p.id})" class="text-red-400 hover:text-red-300 p-2">
              <i class="fa-solid fa-trash-can text-base"></i>
            </button>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    function toggleRole() {
      isAdmin = !isAdmin;
      const btn = document.getElementById('roleToggleBtn');
      const addBtn = document.getElementById('addPlayerBtn');

      if (isAdmin) {
        btn.innerHTML = `<i class="fa-solid fa-user-gear ml-1"></i> وضع الأدمن`;
        btn.className = "bg-yellow-500 text-gray-900 px-3 py-1.5 rounded-full border border-yellow-300 font-bold text-xs shadow";
        addBtn.classList.remove('hidden');
      } else {
        btn.innerHTML = `<i class="fa-solid fa-user-shield ml-1"></i> وضع المشاهد`;
        btn.className = "bg-emerald-800 text-yellow-300 px-3 py-1.5 rounded-full border border-yellow-400 font-semibold text-xs";
        addBtn.classList.add('hidden');
      }
      renderPlayers();
    }

    function openModal() { document.getElementById('playerModal').classList.remove('hidden'); document.getElementById('playerModal').classList.add('flex'); }
    function closeModal() { document.getElementById('playerModal').classList.add('hidden'); document.getElementById('playerModal').classList.remove('flex'); }

    function calculateAge() {
      const dob = document.getElementById('pDob').value;
      if (dob) {
        const birthDate = new Date(dob);
        const diff = Date.now() - birthDate.getTime();
        const ageDate = new Date(diff);
        document.getElementById('pAge').value = Math.abs(ageDate.getUTCFullYear() - 1970);
      }
    }

    function savePlayer(e) {
      e.preventDefault();
      const newPlayer = {
        id: Date.now(),
        name: document.getElementById('pName').value,
        dob: document.getElementById('pDob').value,
        age: document.getElementById('pAge').value,
        position: document.getElementById('pPosition').value,
        photo: document.getElementById('pPhoto').value || 'https://images.unsplash.com/photo-1543351611-c82394862a50?w=150&auto=format&fit=crop'
      };
      players.push(newPlayer);
      renderPlayers();
      closeModal();
      document.getElementById('playerForm').reset();
    }

    function deletePlayer(id) {
      players = players.filter(p => p.id !== id);
      renderPlayers();
    }

    // التشغيل الأولي
    renderPlayers();
  </script>
</body>
</html>
